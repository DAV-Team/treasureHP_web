services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - culture_quest_mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    # Fixed image names let `scripts/package.sh --with-images` export them and another machine load them without rebuilding.
    image: culture-quest-server:latest
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/culture-quest
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@culturequest.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.production}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  client:
    image: culture-quest-client:latest
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy

  seed:
    build:
      context: ./server
      target: build
    profiles: ['seed']
    environment:
      MONGODB_URI: mongodb://mongo:27017/culture-quest
    command: npm run seed
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  culture_quest_mongo_data:
